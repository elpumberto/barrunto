# Tagging a version (v1.2.3) builds the extension and publishes it as a release,
# so that installing it needs neither Node nor building anything. The release says
# what CHANGELOG.md says of that version.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag is the version the extension says it is
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run zip
      - name: Name the archive without its version, so the README's link never goes stale
        run: cp .output/barrunto-*-chrome.zip barrunto-chrome.zip
      - name: Take the notes from the changelog's section for this version
        run: |
          awk -v section="## ${GITHUB_REF_NAME#v}" '$0 == section {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" barrunto-chrome.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
